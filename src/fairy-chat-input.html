<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>요정 채팅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        .chat-input-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(102, 126, 234, 0.3);
            min-width: 300px;
            animation: slideUp 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 15px;
            outline: none;
            font-family: inherit;
            color: #333;
            min-width: 200px;
        }
        
        .chat-input::placeholder {
            color: #999;
        }
        
        .input-buttons {
            display: flex;
            gap: 6px;
        }
        
        .input-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .send-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .attach-btn {
            background: rgba(52, 199, 89, 0.9);
            color: white;
            position: relative;
        }
        
        .attach-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
        }
        
        .attach-btn.drag-over {
            background: rgba(255, 149, 0, 0.9);
            transform: scale(1.15);
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.5);
        }
        
        .voice-btn {
            background: rgba(255, 71, 87, 0.9);
            color: white;
        }
        
        .voice-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        
        .voice-btn.recording {
            background: rgba(255, 71, 87, 0.9);
            animation: recordingPulse 1s infinite;
        }
        
        .file-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        
        .attached-files {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        
        .attached-files.show {
            display: block;
        }
        
        .attached-file {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 12px;
            color: #666;
        }
        
        .attached-file:last-child {
            margin-bottom: 0;
        }
        
        .file-remove {
            margin-left: auto;
            cursor: pointer;
            color: #ff4757;
            font-weight: bold;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes recordingPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 드래그 앤 드롭 전체 영역 */
        .chat-input-container.drag-over {
            border-color: #FF9500;
            box-shadow: 0 8px 32px rgba(255, 149, 0, 0.3);
            background: rgba(255, 255, 255, 0.98);
        }
    </style>
</head>
<body>
    <div class="chat-input-container" id="chatContainer">
        <div class="attached-files" id="attachedFiles"></div>
        
        <input 
            type="text" 
            class="chat-input" 
            id="chatInput" 
            placeholder="요정에게 메시지를 보내세요..."
            maxlength="500"
        />
        
        <div class="input-buttons">
            <button class="input-btn attach-btn" id="attachBtn" onclick="selectFiles()">📎</button>
            <button class="input-btn voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
            <button class="input-btn send-btn" id="sendBtn" onclick="sendMessage()">📤</button>
        </div>
        
        <input type="file" id="fileInput" class="file-input" multiple accept="*/*" onchange="handleFileSelect(event)">
    </div>
    
    <script>
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const fileInput = document.getElementById('fileInput');
        const attachedFiles = document.getElementById('attachedFiles');
        const chatContainer = document.getElementById('chatContainer');
        
        let attachedFilesList = [];
        let isRecording = false;
        
        // 포커스 설정
        chatInput.focus();
        
        // Enter 키 처리
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // 드래그 앤 드롭 처리
        chatContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            chatContainer.classList.add('drag-over');
            attachBtn.classList.add('drag-over');
        });
        
        chatContainer.addEventListener('dragleave', (e) => {
            if (!chatContainer.contains(e.relatedTarget)) {
                chatContainer.classList.remove('drag-over');
                attachBtn.classList.remove('drag-over');
            }
        });
        
        chatContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            chatContainer.classList.remove('drag-over');
            attachBtn.classList.remove('drag-over');
            
            const files = Array.from(e.dataTransfer.files);
            addFilesToAttachment(files);
        });
        
        function selectFiles() {
            fileInput.click();
        }
        
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            addFilesToAttachment(files);
            event.target.value = ''; // 리셋
        }
        
        function addFilesToAttachment(files) {
            files.forEach(file => {
                if (attachedFilesList.length < 5) { // 최대 5개 파일
                    attachedFilesList.push(file);
                }
            });
            
            updateAttachedFilesDisplay();
            console.log('📎 파일 첨부됨:', files.map(f => f.name));
        }
        
        function updateAttachedFilesDisplay() {
            if (attachedFilesList.length === 0) {
                attachedFiles.classList.remove('show');
                attachedFiles.innerHTML = '';
                return;
            }
            
            attachedFiles.classList.add('show');
            attachedFiles.innerHTML = attachedFilesList.map((file, index) => `
                <div class="attached-file">
                    📄 ${file.name} (${(file.size / 1024).toFixed(1)}KB)
                    <span class="file-remove" onclick="removeFile(${index})">✕</span>
                </div>
            `).join('');
        }
        
        function removeFile(index) {
            attachedFilesList.splice(index, 1);
            updateAttachedFilesDisplay();
        }
        
        function toggleVoice() {
            // 음성 녹음 토글 (기본 구현)
            isRecording = !isRecording;
            
            if (isRecording) {
                voiceBtn.classList.add('recording');
                voiceBtn.textContent = '⏹️';
                console.log('🎤 음성 녹음 시작');
            } else {
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';
                console.log('🎤 음성 녹음 종료');
            }
        }
        
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message && attachedFilesList.length === 0) return;
            
            console.log('📤 메시지 전송:', message);
            console.log('📎 첨부 파일:', attachedFilesList.map(f => f.name));
            
            // 전송 중 UI 상태 변경
            const originalPlaceholder = chatInput.placeholder;
            chatInput.placeholder = '전송 중... ⏳';
            chatInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳';
            
            // 생각중 말풍선 표시
            if (require) {
                const { ipcRenderer } = require('electron');
                ipcRenderer.send('show-thinking-bubble');
            }
            
            // 메시지와 파일 정보를 채팅 API로 전송
            try {
                const response = await fetch('http://localhost:8766/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        attachments: attachedFilesList.map(f => ({ name: f.name, size: f.size })),
                        context: {
                            timestamp: new Date().toISOString(),
                            user_id: 'fairy_chat_user'
                        }
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ 응답 받음:', result.message);
                    
                    // 생각중 말풍선 숨기고 Claude 응답 표시
                    if (require) {
                        const { ipcRenderer } = require('electron');
                        // 생각중 말풍선 숨기기
                        ipcRenderer.send('hide-thinking-bubble');
                        // main.js를 통해 fairy.html의 기존 말풍선에 응답 전송
                        ipcRenderer.send('send-claude-response-to-fairy', result.message);
                    }
                    
                    // 전송 완료 후 리셋
                    chatInput.value = '';
                    attachedFilesList = [];
                    updateAttachedFilesDisplay();
                    
                    // 성공 피드백
                    chatInput.placeholder = `✅ 요정이 답했어요!`;
                    sendBtn.textContent = '✅';
                    
                    setTimeout(() => {
                        chatInput.placeholder = '요정에게 메시지를 보내세요...';
                        sendBtn.textContent = '📤';
                    }, 3000);
                    
                } else {
                    console.error('❌ 전송 실패');
                    
                    // 생각중 말풍선 숨기고 에러 메시지 표시
                    if (require) {
                        const { ipcRenderer } = require('electron');
                        // 생각중 말풍선 숨기기
                        ipcRenderer.send('hide-thinking-bubble');
                        ipcRenderer.send('send-claude-response-to-fairy', '죄송해요, 지금 답변하기 어려워요 😅');
                    }
                    
                    chatInput.placeholder = '❌ 전송 실패. 다시 시도해주세요';
                    sendBtn.textContent = '❌';
                    
                    setTimeout(() => {
                        chatInput.placeholder = originalPlaceholder;
                        sendBtn.textContent = '📤';
                    }, 3000);
                }
                
            } catch (error) {
                console.error('❌ 전송 오류:', error);
                
                // 생각중 말풍선 숨기고 네트워크 오류 표시
                if (require) {
                    const { ipcRenderer } = require('electron');
                    // 생각중 말풍선 숨기기
                    ipcRenderer.send('hide-thinking-bubble');
                    ipcRenderer.send('send-claude-response-to-fairy', '네트워크에 문제가 있는 것 같아요 🥺');
                }
                
                chatInput.placeholder = '❌ 네트워크 오류입니다';
                sendBtn.textContent = '❌';
                
                setTimeout(() => {
                    chatInput.placeholder = originalPlaceholder;
                    sendBtn.textContent = '📤';
                }, 3000);
            } finally {
                // 생각중 말풍선 확실히 숨기기 (안전장치)
                if (require) {
                    const { ipcRenderer } = require('electron');
                    ipcRenderer.send('hide-thinking-bubble');
                }
                
                // UI 상태 복원
                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }
        
        // ESC 키로 창 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });
        
        // 5초 후 자동 포커스 유지 알림
        setTimeout(() => {
            if (!document.hasFocus()) {
                console.log('📱 채팅 입력창이 활성 상태입니다');
            }
        }, 5000);
        
        console.log('💬 요정 채팅 입력창 로드 완료!');
    </script>
</body>
</html>
